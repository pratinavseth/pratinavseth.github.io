# "In plain words" summaries, keyed by paper id from publications.yaml.
# Each one restates the paper's own abstract in everyday language: no claim, number or result that the abstract
# does not contain. Papers without an abstract on file have no entry; add one only from the paper's own text.

aligntune: "Aligning a language model after training usually means juggling separate tools and glue code, which makes experiments hard to repeat. AlignTune puts supervised fine-tuning and RLHF-style training behind one interface with swappable TRL and Unsloth backends, and adds shared rewards and evaluation so results can be compared fairly."
c-delta-theta: "Controlling when a model refuses usually costs extra computation on every request. This paper finds the small circuit inside the model that drives refusal for a given category of request, then edits only the weights on that circuit, typically under 5% of parameters. The result is an ordinary checkpoint with no inference-time hooks."
alignbeam: "A model fine-tuned for one domain often loses its safety behaviour and answers harmful prompts phrased in that domain's language. ALIGNBEAM lets a safer model steer the specialist while it generates text, even when the two use different vocabularies, and a small judge picks the safest of several candidate continuations. No weights change, and the safety and utility balance can be tuned after deployment."
forgetting-that-sticks: "Unlearning is usually tested at full precision, but deployed models are quantized, and 4-bit quantization can undo it. The paper shows that methods either lose the forgetting or barely change the model, because their per-parameter updates are far smaller than a quantization step. It proposes MANSU, which isolates the part of the model tied to the forgotten content so the change can survive compression."
position: "Governance frameworks ask for evidence about things like hidden objectives and loss-of-control risks, but behavioural tests and red-teaming can only see a model's outputs. The paper names this mismatch the audit gap, introduces the idea of fragile assurance for safety claims the evidence cannot support, and analyses an inventory of 21 assurance instruments against it."
what-do-compliance-detectors-read: "Compliance detectors are meant to check a model's output against a written rule. This audit finds their verdicts do not depend on the rule: deleting, permuting or swapping it leaves accuracy unchanged for every guard model and probe tested. The paper calls this rule blindness and builds a benchmark in which neither the rule nor the scenario alone predicts the label."
cited-but-not-consulted: "Models often justify a legal decision by naming the statute or precedent behind it. Holding the case facts fixed and swapping in an unrelated authority, the paper finds models name the correct authority in 66.7% to 100% of generations, yet the verdict changes far less consistently. Neither scale nor a model built for legal reasoning closed the gap."
verdict-without-the-rule: "Compliance systems assume a verdict depends on the regulatory rule they are given. Across five models and 20 regulatory and platform-policy domains, deleting, swapping or negating the rule often leaves the verdict unchanged. The guard model was the least rule-sensitive and least accurate, at 51% against 90 to 92% for general-purpose models."
every-ablation-is-a-dose: "When part of a language model is removed, other parts seem to compensate, which is called self-repair. The paper argues this has one explanation: treat any ablation as a point on a strength axis, and the repair response follows a simple linear law whose slope is fixed with or without ablation. The slope's sign shows whether a unit counteracts or reinforces the removed signal."
safetune: "Methods for repairing safety drift after fine-tuning are scattered across incompatible code and evaluation setups. SafeTune brings four approaches together, weight recovery, safety-constrained fine-tuning, gradient-based unlearning and inference-time steering, in one configuration-driven workflow with shared interpretability, evaluation and deployment tools. It is demonstrated on finance and medical case studies."
curatorkit: "Data curation for post-training is often split across separate tools, which makes it hard to see why a sample was rejected. CuratorKIT runs ingestion, cleaning, synthetic generation and quality gates in one pipeline and records every decision for each sample in a provenance chain. It exports to formats ready for TRL, Unsloth and AlignTune."
provenance-grounded-gating: "Synthetic training data is often filtered by reward models or judges, and rejected samples are thrown away. This controlled study asks whether grounding the filter in the source evidence helps, and whether rejected samples can be recovered. Exact provenance improved faithfulness gating for stronger judges, hallucination and reward gates rejected largely different samples so both were needed, and diagnose-then-regenerate recovery beat naive resampling."
interpretability-as-alignment: "Audits, certification and insurance for frontier AI need evidence about what happens inside a model, not only how it behaves. This paper argues that interpretability should be a design requirement that builds auditability, provenance and bounded transparency into models, and outlines how that could support private AI governance."
interpretability-aware-pruning: "Medical imaging models are often too large and too opaque for clinical use. This work uses interpretability methods to decide which parts of each layer to keep, compressing the model while preserving accuracy and clinically meaningful representations. Experiments on several medical image classification benchmarks show high compression with minimal accuracy loss."
bridging-the-gap-in-xai: "Auditors, insurers and certification bodies need standard ways to judge explanations, but current explainability metrics are fragmented and easy to manipulate. The paper argues that standardized metrics can act as governance building blocks, identifies gaps in faithfulness, tamper resistance and regulatory alignment, and links interpretability to model alignment."
dlbacktrace: "Most deep learning models are black boxes. DLBacktrace is an explanation method that works on any architecture, from MLPs and CNNs to transformer language models, and the paper benchmarks it against established methods such as SHAP, LIME and GradCAM."
xai-evals: "Explanation methods such as SHAP and LIME are widely used but rarely tested for reliability. xai_evals is a Python package that generates, benchmarks and evaluates explanations on tabular and image data, with metrics for faithfulness, sensitivity and robustness."
circuitkit: "Circuit analysis can guide pruning, editing and steering, but discovery, evaluation and intervention usually live in separate code. CircuitKIT connects them through one typed, serializable circuit representation, with discovery algorithms, diagnostics, application modules and interfaces that map structured data into discovery tasks."
faithfulness-to-refusal: "Attribution scores are used to pick neurons for pruning, interpretability and safety edits, but do they find the neurons that matter causally? Two audits using one-shot neuron zeroing find that attribution methods beat activation and magnitude baselines, and that the attributed rows can install refusal on hate and crime while layer-matched random controls fail. Highly rank-stable selectors can be among the least causally valid."
agenttune: "Building, training, evaluating and maintaining tool-using agents usually takes a separate tool for each stage. AgentTune is one Python library with a shared runtime and a two-tier event log that keeps agent trajectories and projects them for training, evaluation and auditing, alongside tool-calling reinforcement learning, agentic distillation and retrieval-augmented generation."
auditkit: "Comparing models and agents means combining benchmark scores, judge ratings, runtime, tool use and retrieval quality, and mismatched formats can hide failures. AuditKIT records all of these in one result format and marks evidence it cannot observe as unscored rather than failed. For agents it adds checks such as turn-aware tool-call matching, and it is illustrated with seven case studies."
orion-msp: "Tabular in-context learning models such as TabPFN and TabICL rival gradient-boosted trees but process features at a single scale, use dense attention that grows quadratically with table width, and run their components strictly in sequence. Orion-MSP is an architecture designed to fix those three limits, starting with multi-scale processing to capture hierarchical feature interactions."
orion-bix: "Orion-BiX is a tabular foundation model for few-shot learning that alternates standard, grouped, hierarchical and relational attention and fuses them into one summary. It is meta-trained on synthetic tables with causal priors, adapts to new tasks in context, and is delivered as a scikit-learn compatible model."
exploring-fine-tuning-for-tabular-foundation-models: "Does fine-tuning help tabular foundation models? This first comprehensive study, across TALENT, OpenML-CC18 and TabZilla, finds that zero-shot models are already strong and that gains from fine-tuning depend on the model and the data. Meta-learning and parameter-efficient tuning give moderate gains in some cases, while full supervised fine-tuning often reduces accuracy or calibration."
tabtune: "Tabular foundation models are hard to adopt because each has its own preprocessing, API and fine-tuning recipe. TabTune puts seven models behind one interface covering zero-shot use, meta-learning, supervised fine-tuning and parameter-efficient tuning, and evaluates performance, calibration and fairness."
pocket-foundation-models: "A fraud scorer may need an answer in under 2 ms, but the best tabular foundation models take 151 to 1,275 ms on GPU. This paper distils such a model into an XGBoost or CatBoost student that runs on CPU, using out-of-fold teacher labels to avoid label leakage. Across 153 datasets, the XGBoost student keeps 96.5% of the teacher's AUC at 1.9 ms."
ensembling-tabular-foundation-models: "Combining several tabular foundation models should help, but it barely does. The six models studied are nearly redundant, with a mean pairwise Q-statistic of 0.961, and across 153 tasks the best ensemble gains 0.18% accuracy over the best single model at 253 times the compute. Stacking with a logistic-regression meta-learner kept competitive accuracy but had the worst log-loss rank among the ensembles."
distilling-tfms-structured-health-data: "Tabular foundation models do well on health data but are costly to run. This study distils them into lightweight models, using out-of-fold teacher labels to avoid context leakage. Across 19 healthcare datasets, the students keep at least 90% of the teacher's AUC and run at least 26 times faster on CPU, while preserving the calibration and fairness that health uses need."
data-presentation-over-architecture: "For credit default prediction with tabular foundation models, how the context is built matters more than which model is used. On Home Credit and Lending Club, balanced and hybrid sampling add 3 to 4 AUC points over uniform sampling, more than the gap between model families. With a balanced context of 5K to 10K examples, the strongest models match classical baselines trained on the full data."
alberta-wells-dataset: "Abandoned oil and gas wells leak methane and groundwater pollutants, and many of their locations are unknown. This paper introduces the first large-scale benchmark for finding them from satellite imagery: over 213,000 wells in Alberta, verified by domain experts, with baseline results for detection and segmentation."
contrails-segmentation: "Contrails from aircraft trap heat and account for over half of aviation's climate impact, but detecting them has been held back by a lack of labelled data. This paper benchmarks several popular deep segmentation models on a human-labelled Landsat-8 contrails dataset."
refuseg: "Brain tumour segmentation breaks down when an MRI modality is missing. ReFuSeg combines information from four MRI modalities (T1, T1c, T2 and FLAIR) and is designed to stay robust when some of them are unavailable."
uatta-ens: "Deep ensembles can diagnose diabetic retinopathy well but give no estimate of how uncertain they are, which raises the risk of misdiagnosis. UATTA-ENS adds uncertainty-aware test-time augmentation to an ensemble for five-class diabetic retinopathy classification, aiming for reliable, well-calibrated predictions."
predictive-uncertainty-distribution-shift: "Models are usually assumed to see deployment data that looks like their training data, which rarely holds. This paper proposes more informative metrics for judging uncertainty and robustness to distributional shift in regression tasks, using the Shifts Weather Prediction Dataset, and evaluates baseline methods."
uatta-eb: "Models that classify mental health conditions from text are often overconfident and poorly calibrated. UATTA-EB ensembles BERT models with uncertainty-aware test-time augmentation to give reliable, well-calibrated predictions across six categories."
fake-training-data: "GANs can generate images to supply training data beyond the available benchmarks. This paper studies what happens when computer vision models are trained on different proportions of synthetic and real data, measuring the effect on robustness to out-of-distribution data and on the quality of predictions."
self-percept: "Spotting manipulation in multi-turn, multi-person conversations is hard for language models. The paper introduces MultiManip, 220 dialogues from reality shows covering 11 types of manipulation, shows that models such as GPT-4o and Llama-3.1-8B struggle even with various prompting strategies, and proposes SELF-PERCEPT, which uses introspection to improve detection."
agrillm: "Farmers in developing countries often cannot afford expert advice, and helplines are costly to run. AgriLLM explores using transformer language models to answer farmers' queries automatically, giving immediate and relevant information."
sss-semeval-2023: "A submission to SemEval-2023 Task 10 on explainable detection of online sexism. The team fine-tuned BERT-based models and combined them by majority voting, which beat the individual models, scoring macro F1 of 0.8392, 0.6092 and 0.4319 on Tasks A, B and C."
rsm-nlp-blp-2023: "A shared-task submission on sentiment analysis of Bangla social media posts, classifying each as positive, negative or neutral. The team fine-tuned multilingual and BERT-based models and combined them with majority-vote and weighted ensembles."
corefusion: "Guided super-resolution of thermal images using visible-light images is hard, and applications fail when one of the two inputs is missing. CoReFusion is a lightweight fusion framework with a regularization technique that keeps performance when either the high-resolution RGB image or the low-resolution thermal image is missing."
lapgsr: "Fusing RGB and thermal images to sharpen thermal pictures often needs heavy models with millions of parameters. LapGSR is a lightweight generative model that applies a Laplacian image pyramid to the RGB image to extract edge information for guided thermal super-resolution."
