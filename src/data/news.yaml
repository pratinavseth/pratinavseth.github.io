- date: "2026.10"
  text: "With the Lexsi Labs team, released corrected Gemma 4 31B checkpoints for multilingual and cybersecurity safety, with improved safety and multi-turn jailbreak resistance while largely preserving broader capabilities. [Paper](https://openreview.net/forum?id=Mgnk5R9Z0l) · [multilingual checkpoint](https://huggingface.co/Lexsi/Gemma-4-31B-it-Multilingual-Safety-Repair) · [cybersecurity checkpoint](https://huggingface.co/Lexsi/Gemma-4-31B-it-Cybersecurity-Safety-Repair) · [technical report](https://lexsi.ai/resources/articles/the-lexsi-alignment-and-safety-stack-correcting-gemma-4-31b-for-multilingual-and-cybersecurity-safety-in-the-weights-copy) · [Safety Stack](https://lexsi.ai/resources/articles/open-sourcing-the-lexsi-alignment-and-safety-stack-frontier-safety-research-for-auditing-correcting-and-verifying-model-weights)"
- date: "2026.10"
  text: "Shared perspectives with Vinay Kumar Sankarapu on AI sycophancy in [Hindustan Times Brunch](https://www.hindustantimes.com/lifestyle/brunch/too-chatty-gpt-why-ai-should-talk-less-and-just-give-us-the-info-we-need-101791477133262.html), in a feature by Taranna Khetpal."
- date: "2026.10"
  text: "Attending [EMNLP 2026](https://2026.emnlp.org/) in Budapest, Hungary (October 24–29)."
- date: "2026.10"
  text: "New pre-print and source-available release: [AgentTune](/publications/agenttune/), a training lifecycle library for tool-using LLM agents ([code](https://github.com/Lexsi-Labs/AgentTune))."
