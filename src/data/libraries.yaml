# Libraries & tools. Star counts are fetched from GitHub at build time using `repo`;
# `stars` is only the fallback used when the GitHub API can't be reached.
# `paper` links to an id in publications.yaml. `logo` is relative to src/assets/images/ (omit to show the name in type). `oss: true` counts toward the "open-source libraries" stat.

- name: TabTune
  logo: logos/tabtune.png
  repo: Lexsi-Labs/TabTune
  paper: tabtune
  stars: 137
  oss: true
  role: Architect
  description: Unified inference, fine-tuning and benchmarking for tabular foundation models (21 models in 7 architecture families).
- name: AlignTune
  logo: logos/aligntune.png
  repo: Lexsi-Labs/aligntune
  paper: aligntune
  stars: 44
  oss: true
  role: Built and scaled
  description: Modular post-training toolkit for SFT, DPO, GRPO and RLHF with interchangeable backends; runs production alignment work in BFSI, legal and healthcare.
- name: CuratorKIT
  logo: logos/curatorkit.png
  repo: Lexsi-Labs/CuratorKIT
  paper: curatorkit
  stars: 30
  oss: true
  role: Built
  description: Provenance-grounded data curation and synthetic generation for LLM post-training.
- name: DLBacktrace v2
  repo: Lexsi-Labs/DLBacktrace
  paper: dlbacktrace-v2
  stars: 28
  oss: true
  role: Re-architected
  description: torch.export-based, model-agnostic explainability for LLMs and MoEs with CUDA acceleration.
- name: CircuitKIT
  logo: logos/circuitkit.png
  repo: Lexsi-Labs/CircuitKIT
  paper: circuitkit
  stars: 26
  oss: true
  role: Built
  description: Circuit discovery, evaluation and application toolkit for mechanistic interpretability.
- name: SafeTune
  logo: logos/safetune.png
  repo: Lexsi-Labs/SafeTune
  paper: safetune
  stars: 19
  oss: true
  role: Led (first author)
  description: Audits and repairs safety drift in fine-tuned LLMs.
- name: xai_evals
  repo: Lexsi-Labs/xai_evals
  paper: xai-evals
  stars: 18
  oss: true
  role: Built
  description: Framework for evaluating post-hoc local explanation methods.
- name: AuditKIT
  logo: logos/auditkit.png
  repo: Lexsi-Labs/AuditKIT
  url: https://auditkit.lexsi.ai/
