- group: "Research positions"
  roles:
    - date: "2026.04 – Present"
      theme: "Research and engineering lead for AI safety & alignment"
      role: "**Lead Research Scientist** at [Lexsi Labs, Lexsi.ai](https://lexsi.ai/) (Aurionpro Solutions Group), Remote"
      points:
        - label: "Platform architecture"
          text: "Architected the lab's [alignment & safety stack](#systems): {libraryCount} single-purpose libraries for data curation, post-training, interpretability, safety repair, compression and evaluation, all writing to one shared evaluation record. The open-source ones have {stars} GitHub stars."
        - label: "Post-training platform"
          text: "Led and built **AlignTune**, then scaled it as design lead into the multi-backend post-training system (SFT, DPO, GRPO, RLHF-style training, model merging) behind the lab's BFSI, legal and healthcare work."
        - label: "Safety repair"
          text: "Led and built [**SafeTune**](https://github.com/Lexsi-Labs/SafeTune) (EMNLP 2026 Demo), which audits safety drift after fine-tuning and repairs it with small weight edits checked for capability loss. Co-led **C-ΔΘ**, circuit-restricted weight edits for selective refusal (ICML 2026 workshop)."
        - label: "Interpretability & agents"
          text: "Led and built **CircuitKIT** for circuit discovery, attribution and interventions. Designed and led [**AgentTune**](https://arxiv.org/abs/2610.13335) for training tool-using agents, mentoring the team that built it."
        - label: "Compression & evaluation"
          text: "Built the lab's pruning library and designed its quantization library, with checks that compressed models keep their safety behavior. Set up config-driven evaluation with LLM judges and CI on CUDA and Apple MPS; contributed to [**AuditKIT**](https://auditkit.lexsi.ai/)."
        - label: "Research output"
          text: "Of the group's 11 papers accepted at EMNLP 2026 and NeurIPS 2026 workshops, I was first author on 4 and mentored the first authors of the other 7, including [ALIGNBEAM](/publications/alignbeam/) (EMNLP Main) and [Provenance-Grounded Gating](/publications/provenance-grounded-gating/) (EMNLP Findings). Applied the work to regulatory-compliance, financial-services, insurance and Indic-language deployments."
        - label: "Leadership"
          text: "Lead the Model Science group, 20+ researchers and interns across India and Paris: research direction, hiring, grants and roadmap. Set the team's standards for evidence-first measurement and reproducible evaluation, and review code across engineering, including the lab's internal AI coding-agent platform."
      papers: [aligntune, curatorkit, circuitkit, safetune, c-delta-theta, alignbeam, forgetting-that-sticks, position, provenance-grounded-gating, cited-but-not-consulted, verdict-without-the-rule, every-ablation-is-a-dose, agenttune, gemma-4-safety-repair]
    - date: "2025.07 – 2026.03"
      theme: "Post-training, interpretability and tabular foundation models"
      role: "**Research Scientist** at [Lexsi Labs, Lexsi.ai](https://lexsi.ai/) (Aurionpro Solutions Group) *[Previously: AryaXAI, Arya.ai]*, Remote"
      points:
        - label: "Model Science Group"
          text: "Led and scaled the lab's Model Science group across post-training alignment, safety, and interpretability into a core research team driving the lab's alignment and safety agenda"
        - label: "AlignTune"
          text: "Built AlignTune, a modular toolkit for post-training alignment of LLMs spanning SFT, preference optimization, and safety methods (44⭐); formalized the **Interpretability as Alignment** framework (EurIPS 2025 Workshop) as a guiding design principle for the team's alignment work"
        - label: "Interpretability"
          text: "Led the lab's interpretability tooling: architected and built **DLBacktrace v2** on a `torch.export`-based graph-capture design to keep it model-agnostic across architectures, with CUDA acceleration for LLMs and MoEs (28⭐); drove actionable interpretability into model optimization through interpretability-aware pruning for medical imaging (MICCAI Workshop 2025)"
        - label: "Tabular Foundation Models"
          text: "Led problem framing, early model design, and benchmarking for the ORION tabular foundation-model series (Orion-BiX, WWW 2026; and Orion-MSP, AITD Workshop @ EurIPS 2025), and drove its extension to regression"
        - label: "TabTune"
          text: "Architected TabTune, an open-source toolkit for inference, fine-tuning, and regression with tabular foundation models (137⭐, WWW 2026 Demo), shipped with an accompanying fine-tuning study; later advised distillation, ensembling (ICML 2026 Workshops), and credit-risk prediction (FinDS @ ACM SIGMOD 2026, Oral) for health and enterprise deployment"
        - label: "Model Compression"
          text: "Built an internal pruning and model-compression toolkit, bringing interpretability-guided compression into the production deployment pipeline"
        - label: "Team & Mentorship"
          text: "Led the Model Science group (14 interns and 5 full-time researchers during this period across India and Paris) spanning tabular, alignment, and interpretability; worked on grants, hiring, and overall planning"
        - label: "Talks & Posters"
          text: "Spotlight talk at EurIPS 2025 Workshop; poster at MICCAI Workshop 2025"
      papers: [interpretability-aware-pruning, interpretability-as-alignment, tabtune, orion-msp, orion-bix, exploring-fine-tuning-for-tabular-foundation-models]
